# manifest.yaml — Homelessness SBA (Comm360 internship), GSU interdisciplinary
# studies. The deployed SBA of this repository.
#
# Used by: scripts/build-static.ts --manifest <this file>
#
# Layout: the files shared by all parts sit here (this manifest, the course
# wrapper hs_course.olx, the consent gate hs_study.olx and consent.olx); each
# part's own files live in its folder: part1/ now, part2/ and part3/ as they
# arrive. The loader scans content_root recursively.
#
# Namespace `homelessness` is shared by all three parts: their block ids never
# overlap (hs_* for Part 1, hs2_* for Part 2), and keeping the namespace
# unchanged keeps students' saved progress valid across rebuilds.

title: Homelessness SBA
namespace: homelessness
content_root: .
classes:
  - no-translanguaging       # disables JIT translanguaging
content_notice: >
  Course content Copyright &copy; 2026 by Omer Ari, Ben Pierce,
  Lia Haddadian, and Piotr Mitros. Licensed under
  [AGPLv3](https://www.gnu.org/licenses/agpl-3.0.html). Source available on
  [GitHub](https://github.com/olxhub/edu.gsu.interdisciplinary).
routes:
  # "/" lands on the consent gate (hs_study.olx); the course renders inside it
  # once the consent question is answered, either way. A deployment outside a
  # study points "/" at homelessness/hs_course instead.
  /: homelessness/hs_study
