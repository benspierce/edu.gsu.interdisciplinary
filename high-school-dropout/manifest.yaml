# manifest.yaml — the high-school-dropout SBA (GSU interdisciplinary studies).
#
# Kept in the repository but NOT currently deployed; the deployed SBA is
# homelessness/. The namespace stays edu.gsu.interdisciplinary so saved
# progress from earlier deployments remains valid.
#
# Used by: scripts/build-static.ts --manifest <this file>

title: Interdisciplinary Studies
namespace: edu.gsu.interdisciplinary
classes:
  - no-translanguaging
content_notice: >
  Course content Copyright &copy; 2026 by Omer Ari, Jonathan David Cohen,
  Paul Deane, Lia Haddadian, Joseph Paul Magliano, Piotr Mitros, and
  Gertrude Tinker Sachs. Licensed under
  [AGPLv3](https://www.gnu.org/licenses/agpl-3.0.html). Source available on
  [GitHub](https://github.com/olxhub/edu.gsu.interdisciplinary).
routes:
  # "/" lands on the consent gate (interdisciplinary_study.olx); the course
  # renders inside it once the consent question is answered, either way. A
  # deployment outside a study points "/" at
  # edu.gsu.interdisciplinary/interdisciplinary_course instead.
  /: edu.gsu.interdisciplinary/interdisciplinary_study
